   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs2" />
  <sodipodi:namedview
     id="namedview2"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#505050"
     inkscape:zoom="2.1275"
     inkscape:cx="44.653349"
     inkscape:cy="43.948296"
     inkscape:window-width="1920"
     inkscape:window-height="1111"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg2" />
  <!-- A standard U-shape for custom neck profile reference -->
  <!-- Start top-left, curve down and across, end top-right -->
  <path
     id="contour"
     d="M 0,0 C 0.47003525,78.052646 18.710758,40.639204 100.04505,40.668676 174.1571,40.69553 200,70.831021 200,0"
     stroke="#000000"
     fill="none"
     stroke-width="2"
     sodipodi:nodetypes="csc" />
  <!-- Midline path to indicate the center of the profile -->
  <path
     id="midline"
     d="M 100,0 L 100,100"
     stroke="red"
     stroke-dasharray="5,5"
     fill="none"
     stroke-width="1" />
  <!-- Indications for Bass and Treble sides -->
  <text
     x="10"
     y="20"
     font-family="Arial"
     font-size="12"
     fill="black"
     id="text1">Bass Side</text>
  <text
     x="120"
     y="20"
     font-family="Arial"
     font-size="12"
     fill="black"
     id="text2">Treble Side</text>
</svg>
